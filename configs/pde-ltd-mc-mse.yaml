project: ape-transformers-mse
name: pde-ltd-mc-s-mse
entity: pde-ltd

trainer:
  base_learning_rate: 5.5e-04
  batch_size: ${batch_size}
  scale_lr: False
  params:
    _file: configs/defaults/default_trainer_args.yaml
    max_epochs: ${max_epochs}
    accumulate_grad_batches: 2
    precision: bf16-mixed

num_train_timesteps: 20

pipelines:
  default:
    target: pde.coupled_video_sampler.VideoPipelineDirect

sigma_min: 1e-4

model:
  target: pde.mixed_channels.SingleStepSupervised
  params:
    model:
      target: pde.mixed_channels.PDE_LTD_Transformer
      params:
        sample_size: 256
        in_channels: 2
        out_channels: 2
        model_type: PDE-S
        # sprint_drop_mode: learned
        patch_size: 4
        periodic: True
        carrier_token_active: False
    monitor: val/loss_epoch
    ckpt_path: ${runtime.checkpoint_dir}
    image_key: 0
    optimizer: adamw

unrolling_steps: 1
test_unrolling_steps: 29

data:
  _file: configs/data/ape_2d_multi_task_norm.yaml

frequency_log_images: 100
frequency_log_metrics: 100
frequency_store_pipelines: 100

callbacks:
  _file: configs/defaults/default_callbacks.yaml
  ema:
    target: pde.callback.EMA
    params:
      decay: 0.999
  images:
    target: pde.callback.MultiTaskVideoLoggerCustom
    params:
      frequency: ${frequency_log_images}
      num_frames: 29
      num_inference_steps: 40
      test_only: True
      prepare_plots:
        target: data.pbdl_module.prepare_plots
  simulation:
    target: pde.callback.Simulation2DMetricLoggerCustom
    params:
      frequency: ${frequency_log_metrics}
      batch_size: ${batch_size}
      num_frames: 29
      num_inference_steps: 40
      test_only: True
      metric_config:
        _file: configs/defaults/default_simulation_metrics.yaml
  emagrad:
    target: pde.callback.EmaGradClip
    params:
      ema_coef1: 0.9
      ema_coef2: 0.99
      max_norm_ratio: 2.0
      clip_norm_ratio: 1.1
